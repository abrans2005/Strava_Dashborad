<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava 控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>
    <div class="layout">
        <header class="header">
            <div class="header-brand">
                <span class="brand-mark"></span>
                <span>Strava 控制台</span>
                <span class="brand-sub" id="header-athlete-sub">正在读取运动员信息…</span>
            </div>
            <div class="header-user">
                <div class="meta">
                    <span class="name" id="header-athlete-name">未授权</span>
                    <span class="sub" id="header-sync-time">数据未同步</span>
                </div>
                <div class="header-avatar" id="header-avatar">S</div>
                <button class="btn-sync" id="header-sync-btn" onclick="syncNow()">
                    <span class="dot"></span><span id="header-sync-label">立即同步</span>
                </button>
            </div>
        </header>

        <div class="body">
            <!-- 左侧菜单栏 -->
            <aside class="sidebar-left">
                <div class="menu-title">功能菜单</div>
                <div class="menu-list">
                    <button class="menu-item" data-route="chart" onclick="navigate('chart')">
                        图表分析
                    </button>
                    <button class="menu-item" data-route="activities" onclick="navigate('activities')">
                        活动列表
                    </button>
                    <button class="menu-item" data-route="training" onclick="navigate('training')">
                        训练负荷
                    </button>
                    <button class="menu-item" data-route="map" onclick="navigate('map')">
                        线路热图
                    </button>
                </div>
            </aside>

            <!-- 中间内容区 -->
            <main class="main">
                <div class="progress-bar" id="page-progress"></div>
                <div class="content-header">
                    <h2 id="page-title">图表分析</h2>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button class="btn-back" onclick="location.href='/'">返回登录页</button>
                    </div>
                </div>
                <!-- 全局筛选：时间范围 + 运动类型，各页面共享，状态随 URL 持久化 -->
                <div class="filter-bar filter-bar-global" id="global-filter-bar">
                    <div class="filter-group">
                        <label for="global-period">时间范围</label>
                        <select id="global-period"></select>
                    </div>
                    <div class="filter-group" id="global-custom-range" style="display:none;">
                        <label>起止日期</label>
                        <div style="display:flex;gap:8px;">
                            <input type="date" id="global-from">
                            <input type="date" id="global-to">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label for="global-sport">运动类型</label>
                        <select id="global-sport">
                            <option value="">全部</option>
                        </select>
                    </div>
                </div>
                <div class="content-body empty" id="result">
                    <div class="state-block">
                        <div class="state-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12h4l2 3h6l2-3h4"></path>
                                <path d="M5.5 6.5h13l2.5 5.5v6a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18v-6z"></path>
                            </svg>
                        </div>
                        <div class="state-title">还没有加载数据</div>
                        <div class="state-desc">从左侧选择「图表分析」开始，页面会自动同步你的 Strava 活动。</div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="footer">Strava Demo App</footer>
    </div>

    <script src="{{ url_for('static', filename='vendor/leaflet.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/filters.js') }}"></script>
    <script src="{{ url_for('static', filename='js/router.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chart-page.js') }}"></script>
    <script src="{{ url_for('static', filename='js/analysis.js') }}"></script>
    <script src="{{ url_for('static', filename='js/maps.js') }}"></script>
    <script src="{{ url_for('static', filename='js/segments.js') }}"></script>
    <script src="{{ url_for('static', filename='js/training.js') }}"></script>
    <script src="{{ url_for('static', filename='js/activities.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
