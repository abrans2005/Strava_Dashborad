<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava 控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css', v=asset_v('vendor/leaflet.css')) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css', v=asset_v('css/dashboard.css')) }}">
</head>

<body>
    <div class="layout">
        <header class="header">
            <div class="header-brand">
                <span class="brand-mark"></span>
                <span>Strava 控制台</span>
                <span class="brand-sub" id="header-athlete-sub">正在读取运动员信息…</span>
            </div>
            <div class="header-user">
                <div class="meta">
                    <span class="name" id="header-athlete-name">未授权</span>
                    <span class="sub" id="header-sync-time">数据未同步</span>
                </div>
                <div class="header-avatar" id="header-avatar">S</div>
                <button class="btn-sync" id="header-sync-btn" onclick="syncNow()">
                    <span class="dot"></span><span id="header-sync-label">立即同步</span>
                </button>
            </div>
        </header>

        <div class="body">
            <!-- 左侧菜单栏（可折叠为图标栏，状态持久化在 localStorage） -->
            <aside class="sidebar-left">
                <div class="menu-head">
                    <div class="menu-title">功能菜单</div>
                    <button class="menu-toggle" id="menu-toggle" onclick="toggleSidebar()" title="收起菜单">‹</button>
                </div>
                <div class="menu-list">
                    <button class="menu-item" data-route="chart" title="图表分析" onclick="navigateMenu('chart')">
                        <span class="mi-icon">📊</span><span class="mi-label">图表分析</span>
                    </button>
                    <button class="menu-item" data-route="activities" title="活动列表" onclick="navigateMenu('activities')">
                        <span class="mi-icon">📋</span><span class="mi-label">活动列表</span>
                    </button>
                    <button class="menu-item" data-route="training" title="训练负荷" onclick="navigateMenu('training')">
                        <span class="mi-icon">📈</span><span class="mi-label">训练负荷</span>
                    </button>
                    <button class="menu-item" data-route="map" title="线路热图" onclick="navigateMenu('map')">
                        <span class="mi-icon">🗺️</span><span class="mi-label">线路热图</span>
                    </button>
                    <button class="menu-item" data-route="records" title="个人纪录" onclick="navigateMenu('records')">
                        <span class="mi-icon">🏅</span><span class="mi-label">个人纪录</span>
                    </button>
                    <button class="menu-item" data-route="gear" title="装备里程" onclick="navigateMenu('gear')">
                        <span class="mi-icon">🚲</span><span class="mi-label">装备里程</span>
                    </button>
                    <button class="menu-item" data-route="compare" title="周期对比" onclick="navigateMenu('compare')">
                        <span class="mi-icon">⚖️</span><span class="mi-label">周期对比</span>
                    </button>
                </div>
            </aside>

            <!-- 中间内容区 -->
            <main class="main">
                <div class="progress-bar" id="page-progress"></div>
                <div class="content-header">
                    <h2 id="page-title">图表分析</h2>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button class="btn-back" onclick="location.href='/'">返回登录页</button>
                    </div>
                </div>
                <!-- 全局筛选：时间范围 + 运动类型，各页面共享，状态随 URL 持久化 -->
                <div class="filter-bar filter-bar-global" id="global-filter-bar">
                    <div class="filter-group">
                        <label for="global-period">时间范围</label>
                        <select id="global-period"></select>
                    </div>
                    <div class="filter-group" id="global-custom-range" style="display:none;">
                        <label>起止日期</label>
                        <div style="display:flex;gap:8px;">
                            <input type="date" id="global-from">
                            <input type="date" id="global-to">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label for="global-sport">运动类型</label>
                        <select id="global-sport">
                            <option value="">全部</option>
                        </select>
                    </div>
                </div>
                <div class="content-body empty" id="result">
                    <div class="state-block">
                        <div class="state-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12h4l2 3h6l2-3h4"></path>
                                <path d="M5.5 6.5h13l2.5 5.5v6a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18v-6z"></path>
                            </svg>
                        </div>
                        <div class="state-title">还没有加载数据</div>
                        <div class="state-desc">从左侧选择「图表分析」开始，页面会自动同步你的 Strava 活动。</div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="footer">Strava Demo App</footer>
    </div>

    <script src="{{ url_for('static', filename='vendor/leaflet.js', v=asset_v('vendor/leaflet.js')) }}"></script>
    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js', v=asset_v('vendor/chart.umd.min.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/core.js', v=asset_v('js/core.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/filters.js', v=asset_v('js/filters.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/router.js', v=asset_v('js/router.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js', v=asset_v('js/charts.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/chart-page.js', v=asset_v('js/chart-page.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/analysis.js', v=asset_v('js/analysis.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/maps.js', v=asset_v('js/maps.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/segments.js', v=asset_v('js/segments.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/training.js', v=asset_v('js/training.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/records.js', v=asset_v('js/records.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/gear.js', v=asset_v('js/gear.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/compare.js', v=asset_v('js/compare.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/activities.js', v=asset_v('js/activities.js')) }}"></script>
    <script src="{{ url_for('static', filename='js/main.js', v=asset_v('js/main.js')) }}"></script>
</body>

</html>
